<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Dashboard de Empréstimos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light p-4">
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📊 Dashboard de Empréstimos</h2>
        <a href="{% url 'lista_livros' %}" class="btn btn-outline-secondary">← Voltar ao Acervo</a>
    </div>

    <!-- Cards de Resumo -->
    <div class="row mb-4 text-center">
        <div class="col-md-4">
            <div class="card p-3 shadow-sm border-primary">
                <h5>Total de Livros</h5>
                <h2 class="text-primary">{{ total_livros }}</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3 shadow-sm border-success">
                <h5>Total de Membros</h5>
                <h2 class="text-success">{{ total_membros }}</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3 shadow-sm border-warning">
                <h5>Total de Empréstimos</h5>
                <h2 class="text-warning">{{ total_emprestimos }}</h2>
            </div>
        </div>
    </div>

    <!-- Gráfico com Chart.js -->
    <div class="card shadow-sm p-4">
        <h4>Evolução Mensal de Empréstimos</h4>
        <canvas id="meuGrafico" height="100"></canvas>
    </div>
</div>

<script>
    const ctx = document.getElementById('meuGrafico').getContext('2d');
    const meuGrafico = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: {{ chart_labels|safe }},
            datasets: [{
                label: 'Número de Empréstimos',
                data: {{ chart_valores|safe }},
                backgroundColor: 'rgba(54, 162, 235, 0.6)',
                borderColor: 'rgba(54, 162, 235, 1)',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: { beginAtZero: true }
            }
        }
    });
</script>
</body>
</html>
